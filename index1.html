<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div id="clock">
        <h2>THE TIME IS NOW</h2>
        <div id="time">
            <div class="box" style="--color: #1e90ff;">
                <span id="hour">00</span>
                <span>HOURS</span>
            </div>
            <div class="box" style="--color: #00bfff;">
                <span id="minutes">00</span>
                <span>MINUTES</span>
            </div>
            <div class="box" style="--color: #ff0066;">
                <span id="seconds">00</span>
                <span>SECONDS</span>
            </div>
        </div>
    </div>
    <script src="script1.js"></script>
</body>
</html>
